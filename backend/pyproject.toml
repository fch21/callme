[project]
name = "callme-backend"
version = "0.1.0"
description = "CallMe backend — FastAPI service that powers the AI persona."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pypdf>=5.1",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "elevenlabs>=2.45.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
